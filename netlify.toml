[build]
  publish = "dist"
  command = "php build.php"

[build.environment]
  PHP_VERSION = "8.2"

[[redirects]]
  # This ensures it catches "/trainings" and "/trainings/" before the catch-all.
  from = "/trainings"
  to = "/trainings/schedules.json"
  status = 200
  force = true

[[redirects]]
  from = "/trainings/"
  to = "/trainings/schedules.json"
  status = 200
  force = true
# Catch-all for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  publish = "dist"

[context.deploy-preview]
  publish = "dist"

[context.branch-deploy]
  publish = "dist"


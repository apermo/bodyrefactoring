# Secure Schedule Access
# Block direct access to JSON files in schedules directory
# All schedule access should go through schedules/index.php API

location ~ ^/schedules/.*\.json$ {
    deny all;
    return 403;
}

# Rewrite /schedules/day/ to /schedules/day.php for clean URLs
location = /schedules/day/ {
    rewrite ^(.*)$ /schedules/day.php last;
}

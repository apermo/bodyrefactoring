name: AI PR Summary

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-summary:
    name: Generate AI Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Get PR diff
        id: get-diff
        run: |
          # Fetch base branch
          git fetch origin ${{ github.event.pull_request.base.ref }}

          # Get diff stats
          DIFF_STATS=$(git diff --stat origin/${{ github.event.pull_request.base.ref }}...HEAD)
          echo "Diff stats:"
          echo "$DIFF_STATS"

          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Get diff (limited to prevent token overflow)
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- . ':!package-lock.json' ':!composer.lock' | head -c 50000)

          # Save to file for easier handling
          echo "$DIFF" > diff.txt
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF_STATS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate AI Summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('diff.txt', 'utf8');
            const stats = `${{ steps.get-diff.outputs.stats }}`;

            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Get commit messages
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const commitMessages = commits.map(c => c.commit.message).join('\n');

            // Prepare prompt for summary
            const prompt = `Analyze this pull request and generate a concise technical summary.

PR Title: ${pr.title}
PR Description: ${pr.body || 'No description provided'}

Commit Messages:
${commitMessages}

File Changes:
${stats}

Code Diff (truncated):
${diff.substring(0, 10000)}

Generate a summary with:
1. **What Changed**: Brief technical overview
2. **Key Changes**: Bullet points of main changes
3. **Files Modified**: List of affected files with change type
4. **Impact**: What this affects (features, performance, dependencies, etc.)

Keep it concise and technical. Use markdown formatting.`;

            // Note: This uses GitHub's context but doesn't actually call an AI API
            // You would need to integrate with OpenAI API, Anthropic, or similar
            // For now, we'll generate a structured summary based on the data

            const changedFiles = stats.split('\n').filter(line => line.includes('|'));
            const fileCount = changedFiles.length;
            const hasTrainings = diff.includes('trainings/');
            const hasJS = diff.includes('.js');
            const hasCSS = diff.includes('.css');
            const hasPHP = diff.includes('.php');
            const hasWorkflows = diff.includes('.github/workflows');

            let summary = '## 🤖 AI-Generated Summary\n\n';
            summary += '### What Changed\n\n';

            // Generate summary based on changes
            const changes = [];
            if (hasTrainings) changes.push('training schedules or validation');
            if (hasJS) changes.push('JavaScript functionality');
            if (hasCSS) changes.push('styling and animations');
            if (hasPHP) changes.push('backend logic');
            if (hasWorkflows) changes.push('GitHub Actions workflows');

            if (changes.length > 0) {
              summary += `This PR modifies ${changes.join(', ')}.\n\n`;
            }

            summary += `### Key Changes\n\n`;

            // Analyze commits for patterns
            const commitLines = commitMessages.split('\n').filter(m => m.trim());
            const uniqueCommits = [...new Set(commitLines)].slice(0, 5);
            uniqueCommits.forEach(commit => {
              if (commit.trim()) {
                summary += `- ${commit.trim()}\n`;
              }
            });

            summary += `\n### Files Modified\n\n`;
            summary += `📊 **${fileCount} file(s) changed**\n\n`;
            summary += '```\n' + stats + '\n```\n\n';

            summary += '### Impact\n\n';

            const impacts = [];
            if (hasTrainings) impacts.push('🏋️ Training schedules and validation logic');
            if (hasJS) impacts.push('⚡ Frontend functionality and user interactions');
            if (hasCSS) impacts.push('🎨 Visual appearance and animations');
            if (hasPHP) impacts.push('🔧 Backend processing and data handling');
            if (hasWorkflows) impacts.push('🤖 CI/CD automation and workflows');

            impacts.forEach(impact => {
              summary += `- ${impact}\n`;
            });

            summary += '\n---\n';
            summary += '*This summary was automatically generated. Review the actual code changes for complete details.*\n';

            // Find and update or create summary comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const summaryComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('AI-Generated Summary')
            );

            if (summaryComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: summaryComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }


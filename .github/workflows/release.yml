name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from composer.json
        id: version
        run: |
          VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'))->version;")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update changelog date
        if: steps.check-tag.outputs.exists == 'false'
        id: update-changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TODAY=$(date +%Y-%m-%d)
          # Replace [Unreleased] with [VERSION] - DATE (Keep a Changelog standard)
          if grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            sed -i "s/^## \[Unreleased\]/## [$VERSION] - $TODAY/" CHANGELOG.md
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "date=$TODAY" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changelog date
        if: steps.update-changelog.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): set release date for v${{ steps.version.outputs.version }}"
          git push

      - name: Get release target
        if: steps.check-tag.outputs.exists == 'false'
        id: target
        run: |
          # Use current HEAD - either changelog commit or original merge commit
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Extract changelog notes
        if: steps.check-tag.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract section for this version from CHANGELOG
          # Match from "## [VERSION]" to next "## [" or end of file
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md)
          # Write to file for multiline handling
          echo "$NOTES" > release_notes.md

      - name: Create draft release
        if: steps.check-tag.outputs.exists == 'false'
        id: create-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Create draft release pointing to HEAD (includes changelog commit if made)
          # Publishing the draft will create the tag and trigger deploy
          RELEASE_URL=$(gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --draft \
            --target ${{ steps.target.outputs.sha }})
          echo "url=$RELEASE_URL" >> $GITHUB_OUTPUT

      - name: Comment on merged PR
        if: steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the PR that was merged with this commit
          PR_NUMBER=$(gh pr list --state merged --search "${{ github.sha }}" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "🚀 Draft release created: ${{ steps.create-release.outputs.url }}"
          fi

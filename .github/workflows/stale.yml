name: 'Close stale issues and PRs'

on:
  schedule:
    - cron: '0 10 * * *' # Daily at 10am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Timing (separate for issues and PRs)
          # -1 is actions/stale's "never close" value: items are still
          # labelled stale, but they are never closed automatically.
          days-before-issue-stale: 30
          days-before-issue-close: -1
          days-before-pr-stale: 14
          days-before-pr-close: -1

          # Labels
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'

          # Exempt labels (won't be marked stale)
          # Only unlabeled issues and "question" issues can go stale
          exempt-issue-labels: 'bug,documentation,type: feature,type: refactor,type: chore,type: test,area: rep-counter,area: gamification,area: schedule,area: state-machine,area: pwa,area: ui,area: testing,priority: high,priority: low,pinned,security,in-progress'
          exempt-pr-labels: 'dependencies,security,in-progress'

          # Messages
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will not be closed automatically.
            If this issue is still relevant, please add a label or comment.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            recent activity. It will not be closed automatically.
            If this PR is still relevant, please comment or remove the stale label.

          # Operations per run (GitHub API rate limiting)
          operations-per-run: 30

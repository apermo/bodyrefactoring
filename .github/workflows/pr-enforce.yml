name: Enforce PR Requirements

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  enforce-requirements:
    name: Enforce PR Requirements
    runs-on: ubuntu-latest
    steps:
      - name: Set initial status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'PR Requirements',
              description: 'Waiting for validation checks...'
            });

      - name: Wait for validation checks to complete
        uses: actions/github-script@v7
        with:
          script: |
            const requiredChecks = ['Check Version Bump', 'Check CHANGELOG Entry', 'Validate Training Schedules'];
            const maxWaitTime = 5 * 60 * 1000; // 5 minutes
            const pollInterval = 10 * 1000; // 10 seconds
            const startTime = Date.now();

            console.log('Waiting for validation checks to complete...');
            console.log('Required checks:', requiredChecks);

            while (Date.now() - startTime < maxWaitTime) {
              // Get all check runs for this commit
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.sha
              });

              // Find our validation checks
              const versionCheck = checkRuns.check_runs.find(cr => cr.name === 'Check Version Bump');
              const changelogCheck = checkRuns.check_runs.find(cr => cr.name === 'Check CHANGELOG Entry');
              const scheduleCheck = checkRuns.check_runs.find(cr => cr.name === 'Validate Training Schedules');

              // Check if all required checks are completed (not just started)
              const allChecksCompleted = [versionCheck, changelogCheck, scheduleCheck].every(check => {
                return check && check.status === 'completed';
              });

              if (allChecksCompleted) {
                console.log('All validation checks completed!');
                break;
              }

              // Log current status
              console.log(`Waiting... (${Math.round((Date.now() - startTime) / 1000)}s elapsed)`);
              console.log('Status:', {
                version: versionCheck ? `${versionCheck.status}/${versionCheck.conclusion}` : 'not found',
                changelog: changelogCheck ? `${changelogCheck.status}/${changelogCheck.conclusion}` : 'not found',
                schedule: scheduleCheck ? `${scheduleCheck.status}/${scheduleCheck.conclusion}` : 'not found'
              });

              // Wait before next poll
              await new Promise(resolve => setTimeout(resolve, pollInterval));
            }

            if (Date.now() - startTime >= maxWaitTime) {
              console.log('⚠️ Timeout waiting for validation checks');
            }

      - name: Check validation results
        id: check-results
        uses: actions/github-script@v7
        with:
          script: |
            // Get all check runs for this commit
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });

            console.log('Check runs:', JSON.stringify(checkRuns.check_runs.map(cr => ({
              name: cr.name,
              conclusion: cr.conclusion,
              status: cr.status
            })), null, 2));

            // Find our validation jobs
            const versionCheck = checkRuns.check_runs.find(cr => cr.name === 'Check Version Bump');
            const changelogCheck = checkRuns.check_runs.find(cr => cr.name === 'Check CHANGELOG Entry');
            const scheduleCheck = checkRuns.check_runs.find(cr => cr.name === 'Validate Training Schedules');

            let allPassed = true;
            let failedChecks = [];

            // Version check: must exist and be successful (or skipped)
            if (versionCheck && versionCheck.conclusion === 'failure') {
              allPassed = false;
              failedChecks.push('Version bump');
            } else if (!versionCheck) {
              console.log('⚠️ Version check not found - treating as pass');
            } else if (versionCheck.conclusion === 'skipped') {
              console.log('Version check skipped - treating as pass');
            }

            // CHANGELOG check: must exist and be successful (or skipped)
            if (changelogCheck && changelogCheck.conclusion === 'failure') {
              allPassed = false;
              failedChecks.push('CHANGELOG entry');
            } else if (!changelogCheck) {
              console.log('⚠️ CHANGELOG check not found - treating as pass');
            } else if (changelogCheck.conclusion === 'skipped') {
              console.log('CHANGELOG check skipped - treating as pass');
            }

            // Schedule check: must not fail (success or skipped is ok)
            if (scheduleCheck && scheduleCheck.conclusion === 'failure') {
              allPassed = false;
              failedChecks.push('Schedule validation');
            } else if (!scheduleCheck) {
              console.log('⚠️ Schedule check not found - treating as pass');
            } else if (scheduleCheck.conclusion === 'skipped') {
              console.log('Schedule check skipped - treating as pass');
            }

            // Set outputs for use in subsequent steps
            core.setOutput('all_passed', allPassed);
            core.setOutput('failed_checks', failedChecks.join(', ') || 'none');

      - name: Update status (success)
        if: steps.check-results.outputs.all_passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'PR Requirements',
              description: '✅ All requirements met'
            });

      - name: Update status (failure)
        if: steps.check-results.outputs.all_passed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const failedChecks = '${{ steps.check-results.outputs.failed_checks }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'failure',
              context: 'PR Requirements',
              description: `❌ Failed: ${failedChecks}`
            });

            core.setFailed(`PR requirements not met: ${failedChecks}`);


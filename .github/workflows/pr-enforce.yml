name: Enforce PR Requirements

on:
  workflow_run:
    workflows: ["PR Validation"]
    types:
      - completed

permissions:
  contents: read
  statuses: write
  checks: write
  pull-requests: read

jobs:
  enforce-requirements:
    name: Enforce PR Requirements
    runs-on: ubuntu-latest
    # Only run if PR Validation completed (success or failure)
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open'
            });

            if (pulls.data.length === 0) {
              console.log('No open PR found for this branch');
              return null;
            }

            const pr = pulls.data[0];
            console.log(`Found PR #${pr.number}`);
            return pr.number;

      - name: Set initial status
        if: steps.pr.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'PR Requirements',
              description: 'Checking validation results...'
            });

      - name: Check validation results
        if: steps.pr.outputs.result != 'null'
        id: check-results
        uses: actions/github-script@v7
        with:
          script: |
            // Get all check runs for this commit
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.workflow_run.head_sha
            });

            console.log('Check runs:', JSON.stringify(checkRuns.check_runs.map(cr => ({
              name: cr.name,
              conclusion: cr.conclusion,
              status: cr.status
            })), null, 2));

            // Find our validation jobs
            const versionCheck = checkRuns.check_runs.find(cr => cr.name === 'Check Version Bump');
            const changelogCheck = checkRuns.check_runs.find(cr => cr.name === 'Check CHANGELOG Entry');
            const scheduleCheck = checkRuns.check_runs.find(cr => cr.name === 'Validate Training Schedules');

            let allPassed = true;
            let failedChecks = [];

            // Version check: must exist and be successful (or skipped)
            if (versionCheck && versionCheck.conclusion === 'failure') {
              allPassed = false;
              failedChecks.push('Version bump');
            } else if (!versionCheck || versionCheck.conclusion === 'skipped') {
              console.log('Version check skipped or not found - treating as pass');
            }

            // CHANGELOG check: must exist and be successful (or skipped)
            if (changelogCheck && changelogCheck.conclusion === 'failure') {
              allPassed = false;
              failedChecks.push('CHANGELOG entry');
            } else if (!changelogCheck || changelogCheck.conclusion === 'skipped') {
              console.log('CHANGELOG check skipped or not found - treating as pass');
            }

            // Schedule check: must not fail (success or skipped is ok)
            if (scheduleCheck && scheduleCheck.conclusion === 'failure') {
              allPassed = false;
              failedChecks.push('Schedule validation');
            } else if (!scheduleCheck || scheduleCheck.conclusion === 'skipped') {
              console.log('Schedule check skipped or not found - treating as pass');
            }

            return { allPassed, failedChecks: failedChecks.join(', ') || 'none' };

      - name: Update status (success)
        if: steps.pr.outputs.result != 'null' && fromJSON(steps.check-results.outputs.result).allPassed
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'success',
              context: 'PR Requirements',
              description: '✅ All requirements met'
            });

      - name: Update status (failure)
        if: steps.pr.outputs.result != 'null' && !fromJSON(steps.check-results.outputs.result).allPassed
        uses: actions/github-script@v7
        with:
          script: |
            const result = ${{ steps.check-results.outputs.result }};
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'failure',
              context: 'PR Requirements',
              description: `❌ Failed: ${result.failedChecks}`
            });

            core.setFailed(`PR requirements not met: ${result.failedChecks}`);


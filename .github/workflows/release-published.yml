name: Release Published

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  update-pr:
    name: Update PR Comment
    runs-on: ubuntu-latest
    steps:
      - name: Find and update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get release info
          TAG="${{ github.event.release.tag_name }}"
          RELEASE_URL="${{ github.event.release.html_url }}"

          # Find the PR by matching head branch to tag (e.g., v14.4.3)
          PR_NUMBER=$(gh pr list --repo ${{ github.repository }} --state merged --head "$TAG" --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No merged PR found for branch $TAG"
            exit 0
          fi

          echo "Found PR #$PR_NUMBER"

          # Find the draft release comment
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("Draft release created")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            echo "Updating comment $COMMENT_ID with strikethrough"
            OLD_BODY=$(gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --jq '.body')
            NEW_BODY="~~${OLD_BODY}~~"
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
              -X PATCH -f body="$NEW_BODY"
          fi

          # Post new comment with final release link
          gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} \
            --body "✅ Released: $RELEASE_URL"

  close-milestone:
    name: Close Milestone
    runs-on: ubuntu-latest
    steps:
      - name: Close matching milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG"

          # Find milestone matching the tag (e.g., v15.0.0)
          MILESTONE_NUMBER=$(gh api "repos/${{ github.repository }}/milestones?state=open" \
            --jq ".[] | select(.title == \"$TAG\") | .number")

          if [ -z "$MILESTONE_NUMBER" ]; then
            echo "No open milestone found matching '$TAG'"
            exit 0
          fi

          echo "Found milestone #$MILESTONE_NUMBER, closing..."

          # Close the milestone
          gh api "repos/${{ github.repository }}/milestones/$MILESTONE_NUMBER" \
            --method PATCH \
            -f state=closed

          echo "✅ Milestone '$TAG' closed successfully"

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    
    <!-- iOS Web App Config -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BodyRefactoring">
    
    <!-- App Icon (PNG) -->
    <link rel="apple-touch-icon" href="gymlogo.png">
    <link rel="icon" type="image/png" href="gymlogo.png">

    <!-- Privacy / Block Bots -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    
    <title>Body Refactoring App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* iOS Safe Area Fixes */
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #0f172a; 
            color: #e2e8f0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overscroll-behavior-y: none; 
        }
        
        .app-container {
            padding: 1rem;
            padding-bottom: 6rem; 
            max-width: 800px;
            margin: 0 auto;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { display: none; }

        .day-card { transition: transform 0.2s ease, background-color 0.2s; border-left: 4px solid transparent; margin-bottom: 1rem; }
        .day-card:active { transform: scale(0.99); } 
        .day-active { background-color: #1e293b; border-left: 4px solid #38bdf8; box-shadow: 0 4px 20px -5px rgba(56, 189, 248, 0.3); }
        .day-complete { border-left: 4px solid #22c55e !important; background-color: rgba(34, 197, 94, 0.05); }

        /* --- LOCKED STATE LOGIC --- */
        /* Header stays clickable, but looks slightly dimmed */
        .day-locked .card-header-content { opacity: 0.7; }
        
        /* Exercises and Weights are disabled */
        .day-locked .exercise-row { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }
        .day-locked .weight-box { opacity: 0.5; pointer-events: none; }
        
        /* Lock icon visibility */
        .day-locked .lock-icon { display: inline-flex !important; }

        .check-circle { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .exercise-row.completed .check-circle { background-color: #22c55e; border-color: #22c55e; transform: scale(1.1); }
        .exercise-row.completed .exercise-text { opacity: 0.4; text-decoration: line-through; }
        
        .phase-badge { font-size: 0.65rem; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-warmup { background: rgba(234, 88, 12, 0.2); color: #fb923c; border: 1px solid rgba(234, 88, 12, 0.3); }
        .badge-main { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-cool { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .today-badge { background: #ef4444; color: white; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: bold; margin-left: auto; animation: pulse 2s infinite; }
        .completed-badge { background: #22c55e; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 10px; display: none; }
        
        .nav-btn { background: #334155; border: 1px solid #475569; padding: 0.75rem; border-radius: 0.75rem; color: white; transition: all 0.2s; display:flex; align-items:center; justify-content:center; }
        .nav-btn:active { background: #475569; transform: scale(0.95); }
        .nav-btn:disabled { opacity: 0.3; background: #1e293b; border-color: #334155; transform: none; }

        .weight-input { 
            background: transparent; border: none; color: #38bdf8; font-weight: 900; 
            text-align: center; width: 100%; padding: 0; margin: 0; -moz-appearance: textfield; 
            font-size: 1.5rem; 
        }
        .weight-input:focus { outline: none; border-bottom: 2px solid #38bdf8; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        #splash-screen {
            position: fixed; inset: 0; background: #0f172a; z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 mb-4 animate-pulse">BODY REFACTORING</h1>
        <div class="text-slate-500 font-mono text-xs">INITIALIZING SYSTEMS...</div>
    </div>

    <div class="app-container">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 pt-4">
            <div>
                <h1 class="text-2xl font-black text-white uppercase leading-none">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600">Body</span> Refactoring
                </h1>
                <p class="text-slate-500 font-mono text-[10px] mt-1">v3.1 // iOS APP READY</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportData()" class="p-2 bg-slate-800 rounded-lg text-blue-400" title="Backup">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
                <button onclick="document.getElementById('import-input').click()" class="p-2 bg-slate-800 rounded-lg text-emerald-400" title="Restore">
                    <i data-lucide="upload" class="w-5 h-5"></i>
                </button>
                <input type="file" id="import-input" class="hidden" accept=".json" onchange="importData(this)">
            </div>
        </div>

        <!-- Navigation -->
        <div class="bg-slate-800/80 backdrop-blur-sm p-3 rounded-2xl border border-slate-700/50 flex justify-between items-center sticky top-2 z-40 shadow-lg mb-6">
            <button onclick="changeWeek(-1)" id="btn-prev" class="nav-btn w-10 h-10"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
            <div class="text-center">
                <div class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">WOCHE</div>
                <div id="week-display" class="font-bold text-white text-base">Aktuell</div>
            </div>
            <button onclick="changeWeek(1)" id="btn-next" class="nav-btn w-10 h-10"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>
        </div>

        <!-- Schedule -->
        <div id="schedule-container"></div>
        
    </div>

    <script>
        const USER_START_DATE = new Date('2025-12-22T00:00:00'); 
        let currentWeekOffset = 0; 
        const STORAGE_PREFIX = "body_refactoring_v1_";
        const NOTE_PREFIX = "body_refactoring_note_";
        const WEIGHT_PREFIX = "body_refactoring_weight_";

        const scheduleTemplate = [
            { id: 'mon', dayIndex: 1, name: 'MONTAG', theme: 'Ganzkörper Kraft', icon: 'dumbbell', colorClass: 'text-blue-400', bgClass: 'bg-blue-500/10', details: [
                { id: 'w', type: 'warmup', title: 'Rudern', desc: '5-10 Min locker' },
                { id: 'm1', type: 'main', title: 'Beinstrecken', desc: '2 x 15 Wdh', weight: '15' },
                { id: 'm2', type: 'main', title: 'Latziehen', desc: '3 x 12 Wdh', weight: '35' },
                { id: 'm3', type: 'main', title: 'Bankdrücken', desc: '3 x 12 Wdh', weight: '30' },
                { id: 'm4', type: 'main', title: 'Schulterdrücken', desc: '2 x 12 Wdh', weight: '10' },
                { id: 'c', type: 'cool', title: 'Cooldown', desc: 'Stretching' }
            ]},
            { id: 'tue', dayIndex: 2, name: 'DIENSTAG', theme: 'Active Office (NEAT)', icon: 'footprints', colorClass: 'text-emerald-400', bgClass: 'bg-emerald-500/10', details: [
                { id: 'w', type: 'warmup', title: 'Joint Mobility', desc: 'Beine ausschütteln' },
                { id: 'm', type: 'main', title: 'Walkingpad', desc: '45-60 Min @ 3-4 km/h' },
                { id: 'c', type: 'cool', title: 'Hüftbeuger Dehnen', desc: '2 Min halten' }
            ]},
            { id: 'wed', dayIndex: 3, name: 'MITTWOCH', theme: 'Ganzkörper Kraft', icon: 'dumbbell', colorClass: 'text-blue-400', bgClass: 'bg-blue-500/10', details: [
                { id: 'w', type: 'warmup', title: 'Blazepods', desc: 'Reaction Drill' },
                { id: 'm1', type: 'main', title: 'Beinstrecken', desc: '2 x 15 Wdh', weight: '15' },
                { id: 'm2', type: 'main', title: 'Latziehen', desc: '3 x 12 Wdh', weight: '35' },
                { id: 'm3', type: 'main', title: 'Bankdrücken', desc: '3 x 12 Wdh', weight: '30' },
                { id: 'm4', type: 'main', title: 'Schulterdrücken', desc: '2 x 12 Wdh', weight: '10' },
                { id: 'c', type: 'cool', title: 'Cooldown', desc: 'Foam Rolling' }
            ]},
            { id: 'thu', dayIndex: 4, name: 'DONNERSTAG', theme: 'Active Recovery', icon: 'gamepad-2', colorClass: 'text-purple-400', bgClass: 'bg-purple-500/10', details: [
                { id: 'w', type: 'warmup', title: 'Armkreisen', desc: 'Schultern lockern' },
                { id: 'm', type: 'main', title: 'Beat Saber (VR)', desc: '30 Min (Expert)' },
                { id: 'm2', type: 'main', title: 'Alt: Yoga', desc: '20 Min Rücken Fokus' },
                { id: 'c', type: 'cool', title: 'Child\'s Pose', desc: 'Entspannung' }
            ]},
            { id: 'fri', dayIndex: 5, name: 'FREITAG', theme: 'Cardio Battle (Boxen)', icon: 'swords', colorClass: 'text-pink-400', bgClass: 'bg-pink-500/10', details: [
                { id: 'w', type: 'warmup', title: 'Schattenboxen', desc: '3 Min locker' },
                { id: 'm', type: 'main', title: 'Boxsack & Pods', desc: '5 Runden à 3 Min' },
                { id: 'c', type: 'cool', title: 'Oberkörper Stretch', desc: 'Brustmuskel dehnen' }
            ]},
            { id: 'sat', dayIndex: 6, name: 'SAMSTAG', theme: 'Nature Walk', icon: 'trees', colorClass: 'text-yellow-400', bgClass: 'bg-yellow-500/10', details: [
                { id: 'w', type: 'warmup', title: 'Gelenke kreisen', desc: 'Vorbereitung' },
                { id: 'm', type: 'main', title: 'Spaziergang', desc: '60 Min Naturschutzgebiet' },
                { id: 'c', type: 'cool', title: 'Waden dehnen', desc: 'Wichtig!' }
            ]},
            { id: 'sun', dayIndex: 0, name: 'SONNTAG', theme: 'Rest & Recovery', icon: 'coffee', colorClass: 'text-slate-300', bgClass: 'bg-slate-700/50', details: [
                { id: 'w', type: 'warmup', title: 'Mobilisation', desc: 'Nacken & Schulterkreisen' },
                { id: 'm', type: 'main', title: 'Active Rest', desc: 'Spazieren. Kein Training.' },
                { id: 'c', type: 'cool', title: 'Mental Reset', desc: 'Wochenplanung' }
            ]}
        ];

        function getComputedSchedule() {
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const currentDayIndex = today.getDay(); 
            const distanceToMonday = (currentDayIndex + 6) % 7; 
            
            const thisWeekMonday = new Date(today);
            thisWeekMonday.setDate(today.getDate() - distanceToMonday);
            
            const displayedMonday = new Date(thisWeekMonday);
            displayedMonday.setDate(thisWeekMonday.getDate() + (currentWeekOffset * 7));

            return scheduleTemplate.map((day, idx) => {
                const targetDate = new Date(displayedMonday);
                targetDate.setDate(displayedMonday.getDate() + idx);
                targetDate.setHours(0,0,0,0);

                const currentYear = new Date().getFullYear();
                const targetYear = targetDate.getFullYear();
                
                let dateOptions = { day: '2-digit', month: '2-digit' };
                if (targetYear !== currentYear) dateOptions.year = 'numeric';
                const dateStr = targetDate.toLocaleDateString('de-DE', dateOptions);
                const isoDate = targetDate.toISOString().split('T')[0];

                const diffTime = today - targetDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                let isLocked = false;
                if (targetDate > today) isLocked = true;
                else if (diffDays > 3) isLocked = true;

                const isRealToday = today.getTime() === targetDate.getTime();

                return { 
                    ...day, 
                    displayDate: dateStr, 
                    storageDate: isoDate,
                    fullDateObj: targetDate,
                    isRealToday: isRealToday,
                    isLocked: isLocked
                };
            });
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';
            
            const computedSchedule = getComputedSchedule();
            
            const btnPrev = document.getElementById('btn-prev');
            const weekDisplay = document.getElementById('week-display');
            const mondayDate = computedSchedule[0].fullDateObj;
            const startDateClean = new Date(USER_START_DATE);
            startDateClean.setHours(0,0,0,0);
            
            btnPrev.disabled = mondayDate <= startDateClean;

            if(currentWeekOffset === 0) weekDisplay.innerText = "Aktuelle Woche";
            else if(currentWeekOffset === -1) weekDisplay.innerText = "Letzte Woche";
            else if(currentWeekOffset > 0) weekDisplay.innerText = `+${currentWeekOffset} Wochen`;
            else weekDisplay.innerText = `${currentWeekOffset} Wochen`;

            let activeElementId = null;

            computedSchedule.forEach((day) => {
                const card = document.createElement('div');
                card.id = `card-${day.storageDate}`;
                
                // Add locked class only to container, styling handles interactions
                let lockedClass = day.isLocked ? 'day-locked' : '';
                let activeClass = day.isRealToday ? 'day-active' : '';
                
                if(day.isRealToday) activeElementId = `card-${day.storageDate}`;

                card.className = `day-card rounded-2xl bg-slate-800/40 border border-slate-700/50 overflow-hidden cursor-pointer ${activeClass} ${lockedClass}`;
                
                const allDone = day.details.every(ex => localStorage.getItem(`${STORAGE_PREFIX}${day.storageDate}_${ex.id}`) === 'true');
                if (allDone) card.classList.add('day-complete');

                let lockIcon = day.isLocked ? `<span class="bg-slate-700/50 text-slate-500 px-2 py-1 rounded ml-2 flex items-center lock-icon"><i data-lucide="lock" class="w-3 h-3"></i></span>` : '';

                let headerHtml = `
                    <div class="p-5 flex justify-between items-center card-header-content" onclick="toggleAccordion('${day.storageDate}')">
                        <div class="flex items-center gap-4">
                            <div class="${day.bgClass} ${day.colorClass} p-3 rounded-xl">
                                <i data-lucide="${day.icon}"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-white flex items-center gap-2 flex-wrap">
                                    ${day.name} 
                                    <span class="text-slate-500 font-normal text-xs ml-1 bg-slate-900/50 px-2 py-0.5 rounded">${day.displayDate}</span>
                                    ${day.isRealToday ? '<span class="today-badge">HEUTE</span>' : ''}
                                    <span class="completed-badge" style="display:${allDone ? 'inline-block' : 'none'}" id="badge-${day.storageDate}">DONE</span>
                                    ${lockIcon}
                                </h3>
                                <p class="text-xs ${day.colorClass} font-mono opacity-80 mt-1">${day.theme}</p>
                            </div>
                        </div>
                        <i data-lucide="chevron-down" id="icon-${day.storageDate}" class="text-slate-500 transition-transform duration-300 ${day.isRealToday ? 'rotate-180' : ''}"></i>
                    </div>
                `;

                let exercisesHtml = '';
                day.details.forEach(ex => {
                    const uniqueKey = `${STORAGE_PREFIX}${day.storageDate}_${ex.id}`;
                    const isChecked = localStorage.getItem(uniqueKey) === 'true';

                    let badgeClass = ex.type === 'warmup' ? 'badge-warmup' : ex.type === 'main' ? 'badge-main' : 'badge-cool';
                    let badgeText = ex.type === 'warmup' ? 'Warm Up' : ex.type === 'main' ? 'Mission' : 'Cooldown';

                    let rightSide = '';
                    if (ex.weight) {
                        const currentWeight = getSmartWeight(ex.id, day.fullDateObj, ex.weight);
                        rightSide = `
                            <div class="weight-box rounded-lg p-2 w-20 flex flex-col items-center justify-center border border-slate-700 bg-slate-900/80 z-10" onclick="event.stopPropagation()">
                                <input type="number" class="weight-input" value="${currentWeight}" onchange="saveWeight('${ex.id}', '${day.storageDate}', this.value)">
                                <span class="text-[9px] text-slate-500 uppercase font-bold">KG</span>
                            </div>`;
                    }

                    exercisesHtml += `
                        <div class="flex items-center gap-4 exercise-row group py-4 border-b border-slate-800/50 last:border-0 ${isChecked ? 'completed' : ''}" 
                             onclick="${day.isLocked ? '' : `toggleCheck(this, '${uniqueKey}', '${day.storageDate}')`}">
                            <div class="w-8 h-8 rounded-full border-2 border-slate-500 check-circle flex items-center justify-center flex-shrink-0">
                                <i data-lucide="check" class="w-5 h-5 text-slate-900"></i>
                            </div>
                            <div class="flex-grow exercise-text">
                                <div class="${badgeClass} mb-1">${badgeText}</div>
                                <div class="font-bold text-white text-lg leading-tight">${ex.title}</div>
                                <div class="text-xs text-slate-400 mt-0.5">${ex.desc}</div>
                            </div>
                            ${rightSide}
                        </div>
                    `;
                });

                const noteKey = `${NOTE_PREFIX}${day.storageDate}`;
                const savedNote = localStorage.getItem(noteKey) || '';
                const prevMemo = getPreviousMemo(day.storageDate);
                let prevMemoHtml = prevMemo ? `<div class="mt-2 p-3 rounded-lg border border-dashed border-slate-700 bg-slate-800/50"><div class="text-[10px] text-slate-500 uppercase flex items-center gap-1 mb-1"><i data-lucide="history" class="w-3 h-3"></i> Memo von letzter Woche</div><div class="text-sm text-slate-400 italic">"${prevMemo}"</div></div>` : '';
                
                const detailsHtml = `
                    <div id="details-${day.storageDate}" class="${day.isRealToday ? '' : 'hidden'} border-t border-slate-700/50 bg-slate-900/30">
                        <div class="p-5">
                            ${exercisesHtml}
                            <div class="mt-4 pt-4 border-t border-slate-800">
                                <label class="text-[10px] text-slate-500 uppercase font-bold mb-2 block tracking-wider">Logbuch</label>
                                <textarea oninput="saveNote('${noteKey}', this.value)" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-slate-300 focus:outline-none focus:border-blue-500 transition-colors h-24 resize-none mb-2" placeholder="Notizen...">${savedNote}</textarea>
                                ${prevMemoHtml}
                            </div>
                        </div>
                    </div>
                `;

                card.innerHTML = headerHtml + detailsHtml;
                container.appendChild(card);
            });

            lucide.createIcons();
            
            if(activeElementId) {
                setTimeout(() => {
                    const el = document.getElementById(activeElementId);
                    if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            }
        }

        function getSmartWeight(exerciseId, targetDate, defaultWeight) {
            let searchDate = new Date(targetDate);
            searchDate.setHours(0,0,0,0);
            while (searchDate >= USER_START_DATE) {
                const dateStr = searchDate.toISOString().split('T')[0];
                const key = `${WEIGHT_PREFIX}${exerciseId}_${dateStr}`;
                const saved = localStorage.getItem(key);
                if (saved) return saved;
                searchDate.setDate(searchDate.getDate() - 7);
            }
            return defaultWeight;
        }

        function getPreviousMemo(targetDateIso) {
            const current = new Date(targetDateIso);
            const prevDate = new Date(current);
            prevDate.setDate(prevDate.getDate() - 7);
            const prevIso = prevDate.toISOString().split('T')[0];
            return localStorage.getItem(`${NOTE_PREFIX}${prevIso}`);
        }

        function changeWeek(direction) {
            if (direction === -1 && document.getElementById('btn-prev').disabled) return;
            currentWeekOffset += direction;
            renderSchedule();
        }

        function toggleAccordion(dateId) {
            const details = document.getElementById(`details-${dateId}`);
            const icon = document.getElementById(`icon-${dateId}`);
            if (details.classList.contains('hidden')) {
                details.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                details.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function toggleCheck(row, storageKey, dateId) {
            row.classList.toggle('completed');
            if (row.classList.contains('completed')) {
                localStorage.setItem(storageKey, 'true');
                miniConfetti(row.querySelector('.check-circle'));
            } else {
                localStorage.removeItem(storageKey);
            }
            checkDayCompletion(dateId);
        }

        function saveNote(key, value) { localStorage.setItem(key, value); }
        function saveWeight(exId, dateIso, value) { localStorage.setItem(`${WEIGHT_PREFIX}${exId}_${dateIso}`, value); }

        function checkDayCompletion(dateId) {
            const container = document.getElementById(`details-${dateId}`);
            const card = document.getElementById(`card-${dateId}`);
            const badge = document.getElementById(`badge-${dateId}`);
            const total = container.querySelectorAll('.exercise-row').length;
            const done = container.querySelectorAll('.exercise-row.completed').length;

            if (total > 0 && total === done) {
                if (!card.classList.contains('day-complete')) {
                    card.classList.add('day-complete');
                    badge.style.display = 'inline-block';
                    superConfetti();
                }
            } else {
                card.classList.remove('day-complete');
                badge.style.display = 'none';
            }
        }

        function exportData() {
            const exportObj = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith(STORAGE_PREFIX) || key.startsWith(NOTE_PREFIX) || key.startsWith(WEIGHT_PREFIX)) {
                    exportObj[key] = localStorage.getItem(key);
                }
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `BodyRefactoring_Backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importData(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    Object.keys(data).forEach(key => {
                        if (key.startsWith(STORAGE_PREFIX) || key.startsWith(NOTE_PREFIX) || key.startsWith(WEIGHT_PREFIX)) {
                            localStorage.setItem(key, data[key]);
                        }
                    });
                    alert('Daten importiert!');
                    location.reload();
                } catch (err) { alert('Fehler beim Import.'); }
            };
            reader.readAsText(file);
        }

        function miniConfetti(element) {
            const rect = element.getBoundingClientRect();
            confetti({
                particleCount: 20, spread: 50, 
                origin: { x: (rect.left + rect.width/2)/window.innerWidth, y: (rect.top + rect.height/2)/window.innerHeight },
                colors: ['#38bdf8', '#f472b6', '#22c55e'], disableForReducedMotion: true,
                ticks: 50, gravity: 1.2, scalar: 0.6, startVelocity: 20
            });
        }
        function superConfetti() {
            var end = Date.now() + 1500;
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#38bdf8', '#f472b6', '#22c55e'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#38bdf8', '#f472b6', '#22c55e'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        window.onload = function() {
            renderSchedule();
            setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; }, 800);
            setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 1300);
        };
    </script>
</body>
</html>
